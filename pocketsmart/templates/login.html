{% extends "base.html" %}
{% block title %}Log in · PocketSmart AI{% endblock %}
{% block content %}
<h2>Log in</h2>
{% if registered %}<div class="alert ok">Account created. Log in to continue.</div>{% endif %}
{% if error %}<div class="alert">{{ error }}</div>{% endif %}
<form class="card" method="post" action="/login">
  <label for="u">Username</label><input id="u" name="username" required autofocus>
  <label for="p">Password</label><input id="p" name="password" type="password" required>
  <button class="btn" type="submit">Log in</button>
  <p>New here? <a href="/register">Create an account</a></p>
</form>
{% endblock %}
